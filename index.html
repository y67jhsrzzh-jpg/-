<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>便利商店/咖啡廳生存日記</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap');

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      font-family: 'DotGothic16', 'Press Start 2P', monospace, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    #app {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }

    .hud-box {
      position: absolute;
      top: 15px;
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid #f1c40f;
      padding: 6px 14px;
      border-radius: 4px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      z-index: 50;
      box-shadow: 4px 4px 0 #000;
      display: none;
    }
    #clock-bar { left: 15px; color: #55efc4; }
    #coin-counter { right: 15px; color: #f1c40f; }

    #start-screen {
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, #3d2b1f 0%, #110805 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 100; padding: 2rem; text-align: center;
    }
    .pixel-title {
      font-size: 2.2rem;
      color: #ffeaa7;
      text-shadow: 4px 4px 0 #c0392b, -2px -2px 0 #000;
      margin-bottom: 1.2rem;
      letter-spacing: 2px;
    }
    .pixel-sub {
      color: #b2bec3;
      font-size: 1rem;
      margin-bottom: 2.5rem;
      letter-spacing: 1px;
    }
    .pixel-btn {
      font-family: inherit;
      background: #f1c40f;
      color: #000;
      border: 4px solid #fff;
      padding: 16px 36px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 6px 6px 0 #000;
    }
    .pixel-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 #000;
    }

    #webgl-container { position: absolute; inset: 0; }

    #touch-controls {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 60;
      display: none;
    }
    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px;
      width: 130px; height: 130px;
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 40px; left: 40px;
      width: 50px; height: 50px;
      background: #f1c40f;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .interact-btn {
      position: absolute; bottom: 35px; right: 30px;
      width: 80px; height: 80px;
      background: #e74c3c;
      border: 4px solid #fff;
      border-radius: 50%;
      color: #fff;
      font-weight: 900;
      font-size: 1.1rem;
      display: flex; justify-content: center; align-items: center;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
    }
    .interact-btn:active { transform: scale(0.92); }

    #hint-bar {
      position: absolute; bottom: 175px; width: 100%;
      text-align: center;
      color: #f1c40f;
      font-size: 1.1rem;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 55;
      display: none;
    }

    #dialogue-layer {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      width: 90%; max-width: 680px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 70;
    }
    .pixel-dialogue-box {
      background: rgba(10, 10, 15, 0.94);
      border: 4px solid #f1c40f;
      padding: 1rem 1.2rem;
      border-radius: 4px;
      box-shadow: 6px 6px 0 #000;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #fff;
      min-height: 3.5rem;
    }
    .pixel-options-grid {
      display: flex; flex-direction: column; gap: 8px;
    }
    .opt-pixel-btn {
      background: #2c3e50;
      border: 3px solid #95a5a6;
      color: #ecf0f1;
      padding: 12px 14px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 3px 3px 0 #000;
    }
    .opt-pixel-btn:active {
      background: #e67e22;
      border-color: #fff;
      transform: translate(2px, 2px);
    }

    #awkward-container {
      width: 100%;
      background: #1e272e;
      height: 14px;
      border: 2px solid #fff;
      margin-top: 10px;
      display: none;
    }
    #awkward-fill {
      width: 0%; height: 100%;
      background: #e74c3c;
      transition: width 0.1s linear;
    }

    #fade-overlay {
      position: absolute; inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 90;
    }

    #fired-screen {
      position: absolute; inset: 0;
      background: rgba(15, 5, 5, 0.96);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      z-index: 200;
      text-align: center;
    }
    #fired-title {
      font-size: clamp(1.4rem, 4.5vw, 2.6rem);
      font-weight: 900;
      color: #ff3838;
      letter-spacing: 2px;
      white-space: nowrap;
      text-shadow: 4px 4px 0 #000;
      max-width: 95vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #retry-btn {
      display: none;
      margin-top: 2rem;
    }

    #victory-screen {
      position: absolute; inset: 0;
      background: rgba(10, 25, 15, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      z-index: 200;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="app">
  <div class="hud-box" id="clock-bar">07:58 AM</div>
  <div class="hud-box" id="coin-counter">0/200 元</div>
  <div id="hint-bar"></div>
  <div id="fade-overlay"></div>

  <div id="start-screen">
    <div class="pixel-title">☕ 打工人極限生存日記</div>
    <div class="pixel-sub">社畜的每一步都在被開除邊緣試探</div>
    <button class="pixel-btn" onclick="startGame()">進入遊戲</button>
  </div>

  <div id="webgl-container"></div>

  <div id="touch-controls">
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>
    <div class="interact-btn" id="btn-action">選擇</div>
  </div>

  <div id="dialogue-layer">
    <div class="pixel-dialogue-box" id="dialogue-text">...</div>
    <div id="awkward-container"><div id="awkward-fill"></div></div>
    <div class="pixel-options-grid" id="options-grid"></div>
  </div>

  <div id="fired-screen">
    <div id="fired-title">你被炒了</div>
    <button class="pixel-btn" id="retry-btn" onclick="retryCurrentLevel()">🔄 重來</button>
  </div>

  <div id="victory-screen">
    <div class="pixel-title" style="color: #55efc4; text-shadow: 4px 4px 0 #000;">🎉 順利下班！</div>
    <p style="color: #f1f2f6; line-height: 2; margin-bottom: 2rem; font-size: 1.1rem;">
      你在老闆、奧客與練舞室打架的夾擊下奇蹟存活！<br>
      解鎖成就：<strong>【特級裝瘋賣傻摸魚仙人】</strong>
    </p>
    <button class="pixel-btn" onclick="location.reload()">重新遊玩</button>
  </div>
</div>

<script>
  let audioCtx = null;
  function initAudioSafe() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
  }
  function playTone(freq = 440, type = 'sine', duration = 0.15) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  // ---------------- 全域 3D 場景 ----------------
  let scene, camera, renderer;
  let playerMesh, bossMesh, leftDoor, rightDoor;
  let barCounter, punchMachineSprite, bossLabelSprite, toiletDoorMesh;
  let dynamicActors = [];
  let spawnedCoins = [];
  let currentLevel = 1;
  let isLevel1Running = false;
  let doorOpen = false;
  let greetedBoss = false;
  let isGreetingAnimating = false;
  let gameTimeSeconds = 0;
  let clockTimer = null;
  let moveInput = { x: 0, z: 0 };
  let currentActiveGuest = null;
  let currentCoinTimer = null;

  // 【優化】眼睛與表情：一律由黑線改成分開的「兩點加眉毛」
  function createFaceTexture(expression = "neutral") {
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#dca878';
    ctx.fillRect(0, 0, 128, 128);

    ctx.fillStyle = '#111';
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 6;

    if (expression === "neutral") {
      // 眉毛（平）
      ctx.beginPath();
      ctx.moveTo(24, 34); ctx.lineTo(54, 34);
      ctx.moveTo(104, 34); ctx.lineTo(74, 34);
      ctx.stroke();

      // 雙眼（兩點：分開的像素大黑點，取代一字黑線）
      ctx.fillRect(30, 52, 14, 14);
      ctx.fillRect(84, 52, 14, 14);

      // 嘴巴
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(46, 94); ctx.lineTo(82, 94);
      ctx.stroke();
    } else if (expression === "angry") {
      // 生氣皺眉（向下傾斜）
      ctx.beginPath();
      ctx.moveTo(22, 28); ctx.lineTo(52, 44);
      ctx.moveTo(106, 28); ctx.lineTo(76, 44);
      ctx.stroke();

      // 雙眼（兩點）
      ctx.fillRect(30, 58, 14, 14);
      ctx.fillRect(84, 58, 14, 14);

      // 氣沖沖的嘴
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(64, 102, 16, Math.PI, Math.PI * 2);
      ctx.stroke();
    }
    return new THREE.CanvasTexture(canvas);
  }

  function makeTextSprite(message, color = "#f1c40f", isBubble = false) {
    const canvas = document.createElement('canvas');
    canvas.width = 384; canvas.height = 96;
    const ctx = canvas.getContext('2d');
    if (isBubble) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 4;
      ctx.strokeRect(10, 10, 364, 76);
      ctx.fillRect(10, 10, 364, 76);
    }
    ctx.font = 'bold 30px sans-serif';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(message, 192, 48);
    const texture = new THREE.CanvasTexture(canvas);
    const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.scale.set(3.2, 0.8, 1);
    return sprite;
  }

  function createCharacter(type = "player") {
    const group = new THREE.Group();

    const bodyGeo = new THREE.BoxGeometry(0.85, 1.1, 0.45);
    const bodyMat = new THREE.MeshLambertMaterial({
      color: type === "boss" ? 0x2c3e50 : (type === "brawler" ? 0x95a5a6 : 0xd35400)
    });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.35;
    body.castShadow = true;
    group.add(body);

    // 頭部綁定專屬兩點加眉毛的面部貼圖
    const headGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
    const skinMat = new THREE.MeshLambertMaterial({ color: 0xdca878 });
    const faceTexture = createFaceTexture("neutral");
    const faceMat = new THREE.MeshLambertMaterial({ map: faceTexture });

    // 順序: [右, 左, 上, 下, 前, 後]
    const headMaterials = [skinMat, skinMat, skinMat, skinMat, faceMat, skinMat];
    const head = new THREE.Mesh(headGeo, headMaterials);
    head.position.y = 2.18;
    head.castShadow = true;
    group.add(head);

    const glassesGeo = new THREE.BoxGeometry(0.58, 0.14, 0.1);
    const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const glasses = new THREE.Mesh(glassesGeo, blackMat);
    glasses.position.set(0, 2.22, 0.28);
    group.add(glasses);

    if (type === "player") {
      const capGeo = new THREE.BoxGeometry(0.6, 0.15, 0.7);
      const capMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
      const cap = new THREE.Mesh(capGeo, capMat);
      cap.position.set(0, 2.48, 0.05);
      group.add(cap);
    } else if (type === "boss") {
      const tieGeo = new THREE.BoxGeometry(0.14, 0.65, 0.06);
      const redMat = new THREE.MeshLambertMaterial({ color: 0xc0392b });
      const tie = new THREE.Mesh(tieGeo, redMat);
      tie.position.set(0, 1.35, 0.25);
      group.add(tie);
    }

    const armGeo = new THREE.BoxGeometry(0.24, 0.9, 0.24);
    const leftArm = new THREE.Mesh(armGeo, skinMat);
    leftArm.position.set(-0.55, 1.35, 0);
    group.add(leftArm);
    const rightArm = new THREE.Mesh(armGeo, skinMat);
    rightArm.position.set(0.55, 1.35, 0);
    group.add(rightArm);

    const legGeo = new THREE.BoxGeometry(0.32, 0.85, 0.32);
    const pantsMat = new THREE.MeshLambertMaterial({
      color: type === "boss" ? 0x1a252f : 0x2c3e50
    });
    const leftLeg = new THREE.Mesh(legGeo, pantsMat);
    leftLeg.position.set(-0.24, 0.45, 0);
    group.add(leftLeg);
    const rightLeg = new THREE.Mesh(legGeo, pantsMat);
    rightLeg.position.set(0.24, 0.45, 0);
    group.add(rightLeg);

    group.userData = { leftLeg, rightLeg, leftArm, rightArm, head, animTime: 0 };
    return group;
  }

  function setCharacterFace(character, expression = "neutral") {
    if (character && character.userData && character.userData.head) {
      const newTex = createFaceTexture(expression);
      character.userData.head.material[4].map = newTex;
      character.userData.head.material[4].needsUpdate = true;
    }
  }

  function initThreeScene() {
    const container = document.getElementById('webgl-container');
    container.innerHTML = '';

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111217);
    scene.fog = new THREE.Fog(0x111217, 16, 45);

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff3e0, 0.9);
    dirLight.position.set(6, 14, 6);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const floorGeo = new THREE.PlaneGeometry(18, 28);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x3e271d });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const streetGeo = new THREE.PlaneGeometry(18, 8);
    const streetMat = new THREE.MeshLambertMaterial({ color: 0x212121 });
    const street = new THREE.Mesh(streetGeo, streetMat);
    street.rotation.x = -Math.PI / 2;
    street.position.set(0, 0.01, 10);
    scene.add(street);

    const wallMat = new THREE.MeshLambertMaterial({ color: 0x2d3436 });
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(18, 5, 0.5), wallMat);
    backWall.position.set(0, 2.5, -10);
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(7, 5, 0.5), wallMat);
    leftWall.position.set(-5.5, 2.5, 6);
    scene.add(leftWall);
    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(7, 5, 0.5), wallMat);
    rightWall.position.set(5.5, 2.5, 6);
    scene.add(rightWall);

    const glassMat = new THREE.MeshLambertMaterial({ color: 0x74b9ff, transparent: true, opacity: 0.55 });
    leftDoor = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 0.1), glassMat);
    leftDoor.position.set(-1, 2, 6);
    scene.add(leftDoor);
    rightDoor = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 0.1), glassMat);
    rightDoor.position.set(1, 2, 6);
    scene.add(rightDoor);

    const barMat = new THREE.MeshLambertMaterial({ color: 0x5d4037 });
    barCounter = new THREE.Mesh(new THREE.BoxGeometry(5.5, 1.4, 2.2), barMat);
    barCounter.position.set(-4, 0.7, -3.5);
    barCounter.castShadow = true;
    scene.add(barCounter);

    const clockDevice = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.4), new THREE.MeshLambertMaterial({ color: 0xf1c40f }));
    clockDevice.position.set(-4, 1.7, -3.5);
    scene.add(clockDevice);

    punchMachineSprite = makeTextSprite("📋 打卡機", "#ffeaa7");
    punchMachineSprite.position.set(-4, 2.6, -3.5);
    scene.add(punchMachineSprite);

    // 廁所與 🚻 門
    toiletDoorMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, 4.2, 0.2), new THREE.MeshLambertMaterial({ color: 0x7f8c8d }));
    toiletDoorMesh.position.set(-6.5, 2.1, -9.8);
    const toiletSign = makeTextSprite("🚻 廁所", "#3498db");
    toiletSign.position.set(-6.5, 3.8, -9.6);
    scene.add(toiletDoorMesh);
    scene.add(toiletSign);

    playerMesh = createCharacter("player");
    playerMesh.position.set(0, 0, 10);
    scene.add(playerMesh);

    bossMesh = createCharacter("boss");
    bossMesh.position.set(3.8, 0, -3.5);
    bossMesh.rotation.y = -Math.PI / 4;
    scene.add(bossMesh);

    bossLabelSprite = makeTextSprite("👔 老闆", "#ff7675");
    bossLabelSprite.position.set(3.8, 3.2, -3.5);
    scene.add(bossLabelSprite);
  }

  function initLevel1() {
    initThreeScene();
    doorOpen = false;
    greetedBoss = false;
    isGreetingAnimating = false;
    gameTimeSeconds = 0;
    updateClockDisplay(7, 58);

    document.getElementById('fade-overlay').style.opacity = '0';
    document.getElementById('clock-bar').style.display = 'block';
    document.getElementById('coin-counter').style.display = 'none';
    document.getElementById('touch-controls').style.display = 'block';
    document.getElementById('hint-bar').style.display = 'block';
    document.getElementById('dialogue-layer').style.display = 'none';
    document.getElementById('hint-bar').innerText = '走到門口按右下角「選擇」開門';

    if (clockTimer) clearInterval(clockTimer);
    clockTimer = setInterval(() => {
      gameTimeSeconds++;
      if (gameTimeSeconds >= 20) {
        updateClockDisplay(8, 0);
        triggerFired("沒有時間觀念");
        clearInterval(clockTimer);
      } else if (gameTimeSeconds >= 10) {
        updateClockDisplay(7, 59);
      }
    }, 10
