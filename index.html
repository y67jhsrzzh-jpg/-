<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>便利商店/咖啡廳生存日記</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap');

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      font-family: 'DotGothic16', 'Press Start 2P', monospace, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    #app {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }

    .hud-box {
      position: absolute;
      top: 15px;
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid #f1c40f;
      padding: 6px 14px;
      border-radius: 4px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      z-index: 50;
      box-shadow: 4px 4px 0 #000;
      display: none;
    }
    #clock-bar { left: 15px; color: #55efc4; }
    #coin-counter { right: 15px; color: #f1c40f; }

    #start-screen {
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, #3d2b1f 0%, #110805 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 100; padding: 2rem; text-align: center;
    }
    .pixel-title {
      font-size: 2.2rem;
      color: #ffeaa7;
      text-shadow: 4px 4px 0 #c0392b, -2px -2px 0 #000;
      margin-bottom: 1.2rem;
      letter-spacing: 2px;
    }
    .pixel-sub {
      color: #b2bec3;
      font-size: 1rem;
      margin-bottom: 2.5rem;
      letter-spacing: 1px;
    }
    .pixel-btn {
      font-family: inherit;
      background: #f1c40f;
      color: #000;
      border: 4px solid #fff;
      padding: 16px 36px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 6px 6px 0 #000;
    }
    .pixel-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 #000;
    }

    #webgl-container { position: absolute; inset: 0; }

    #touch-controls {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 60;
      display: none;
    }
    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px;
      width: 130px; height: 130px;
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
